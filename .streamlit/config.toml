# Vigie — DA « poste de veille » : fond sombre mer/nuit, accent cyan-balise.
[theme]
base = "dark"
primaryColor = "#22B8D6"
backgroundColor = "#0B1A22"
secondaryBackgroundColor = "#12303A"
textColor = "#E7EEF2"
font = "sans serif"

[server]
headless = true
enableStaticServing = true

[browser]
gatherUsageStats = false
